<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9b6bff"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Soundboard</title>
<style>
:root{--bg:#f4f1ff;--ink:#2a2340;--c0:#ff6b6b;--c1:#ffb020;--c2:#2ec4a0;--c3:#3d8bfd;--c4:#9b6bff;--c5:#ff7eb6;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
h1{margin:0;font-size:1.5rem}
button,select,input{font:inherit;color:inherit}
.ib{background:#fff;border:0;border-radius:14px;width:44px;height:44px;font-size:1.3rem;margin-left:8px;box-shadow:0 2px 0 #d9d2f5}
.ib.on{background:var(--c1)}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px}
.chip{flex:none;border:0;border-radius:20px;padding:8px 16px;background:#fff;box-shadow:0 2px 0 #d9d2f5}
.chip.on{background:var(--ink);color:#fff}
#grid{display:grid;gap:12px;padding:0 16px;grid-template-columns:repeat(var(--n,3),1fr)}
.tile{aspect-ratio:1;border:0;border-radius:22px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.18);user-select:none}
.tile:active,.tile.hit{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tile b{font-size:2.4rem;font-weight:400;line-height:1}
.tile span{font-size:.8rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit .tile{touch-action:none;outline:3px dashed rgba(255,255,255,.8);outline-offset:-8px}
.tile.drag{z-index:5;opacity:.8;position:relative}
#add{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:64px;height:64px;border:0;border-radius:50%;background:var(--c0);color:#fff;font-size:2rem;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#ban{margin:0 16px 12px;padding:10px 14px;background:var(--c1);border-radius:14px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;opacity:.7}
dialog{border:0;border-radius:24px;width:min(92vw,440px);padding:18px;color:var(--ink)}
dialog::backdrop{background:rgba(42,35,64,.5)}
dialog h2{margin:0 0 12px;font-size:1.2rem}
label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}
input[type=text],select{width:100%;padding:10px;border:2px solid #e3dcfa;border-radius:12px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--c3);color:#fff;font-weight:700}
.btn.g{background:#e9e4fb;color:var(--ink)}.btn.r{background:var(--c0)}.btn.v{background:var(--c2)}
canvas{width:100%;height:80px;background:#f4f1ff;border-radius:12px;display:block}
input[type=range]{width:100%;accent-color:var(--c4)}
.em{font-size:1.5rem;background:#f4f1ff;border:0;border-radius:10px;width:42px;height:42px}
small{opacity:.7;display:block;margin-top:6px}
</style></head><body>
<header><h1>🔊 Sons</h1><div><button class="ib" id="ed" title="Modifier">✏️</button><button class="ib" id="st" title="Réglages">⚙️</button></div></header>
<div id="ban" hidden></div><nav id="tabs"></nav><main id="grid"></main><button id="add" aria-label="Ajouter un son">＋</button>

<dialog id="dE"><h2 id="eT">Nouveau son</h2>
<div class="row"><button class="btn r" id="rec">● Enregistrer</button><button class="btn g" id="imp">📁 Importer</button><input type="file" id="file" accept="audio/*" hidden></div>
<canvas id="wv" width="400" height="80"></canvas>
<label>Début</label><input type="range" id="ra" min="0" max="1000" value="0">
<label>Fin</label><input type="range" id="rb" min="0" max="1000" value="1000">
<div class="row"><button class="btn v" id="pre">▶ Écouter l’extrait</button><span id="dur"></span></div>
<label>Nom</label><input type="text" id="nm" maxlength="30">
<label>Emoji</label><div class="row" style="align-items:center"><input type="text" id="em" maxlength="4" style="width:70px;font-size:1.5rem;text-align:center"><span id="ems"></span></div>
<label>Catégorie</label><select id="ct"></select>
<label>Volume</label><input type="range" id="vo" min="10" max="100" value="100">
<div class="row"><button class="btn" id="sv">Enregistrer</button><button class="btn g" id="cx">Annuler</button><button class="btn r" id="dl" hidden>Supprimer</button></div></dialog>

<dialog id="dS"><h2>Réglages</h2>
<label>Quand on touche un bouton déjà en lecture</label>
<select id="mo"><option value="restart">Rejouer depuis le début</option><option value="stop">Arrêter le son</option><option value="overlap">Superposer</option></select>
<label>Colonnes</label><select id="nc"><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label>Sauvegarde</label>
<div class="row"><button class="btn" id="ex">Exporter (.json)</button><button class="btn g" id="im">Importer</button><input type="file" id="jf" accept=".json,application/json" hidden></div>
<div class="row"><button class="btn v" id="sn">Sauvegarde interne</button><button class="btn g" id="rs">Restaurer</button></div>
<small id="inf"></small>
<small>La sauvegarde interne garde une seule version (elle remplace la précédente) mais reste dans le navigateur : exporte aussi un fichier .json régulièrement et garde-le hors du téléphone. L’import fusionne avec les sons existants.</small>
<div class="row"><button class="btn g" id="sa">⏹ Tout arrêter</button><button class="btn g" id="cl">Fermer</button></div></dialog>

<script>
const $=s=>document.querySelector(s);
const COL=["#ff6b6b","#ffb020","#2ec4a0","#3d8bfd","#9b6bff","#ff7eb6"];
const EMO="🔔🎺🥁👏😂😱🐶🐱🚗💥🎉🎸🔥👍❓".match(/./gu);
let db,S={id:"state",cats:[{id:"c1",name:"Favoris",col:0}],mode:"restart",cols:3,last:0},sounds=[],cur="all",edit=false,buf={},ctx,playing=[];
const open=()=>new Promise((r,j)=>{const q=indexedDB.open("sb",1);q.onupgradeneeded=()=>["sounds","kv","snap"].forEach(n=>q.result.createObjectStore(n,{keyPath:"id"}));q.onsuccess=()=>r(q.result);q.onerror=j});
const tx=(s,m,f)=>new Promise((r,j)=>{const t=db.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>r(o.result);t.onerror=j});
const put=(s,v)=>tx(s,"readwrite",o=>o.put(v)),del=(s,k)=>tx(s,"readwrite",o=>o.delete(k)),all=s=>tx(s,"readonly",o=>o.getAll()),get=(s,k)=>tx(s,"readonly",o=>o.get(k));
const save=()=>put("kv",S);
const uid=()=>crypto.randomUUID();
const ac=()=>{ctx=ctx||new AudioContext();ctx.resume();return ctx};
const decode=async b=>ac().decodeAudioData(await b.arrayBuffer());
const bufOf=async s=>buf[s.id]||(buf[s.id]=await decode(s.blob));

async function play(s,tile){
  const same=playing.filter(p=>p.id===s.id);
  if(S.mode!=="overlap"&&same.length){same.forEach(p=>p.src.stop());if(S.mode==="stop")return}
  const b=await bufOf(s),src=ac().createBufferSource(),g=ctx.createGain();
  src.buffer=b;g.gain.value=s.vol??1;src.connect(g).connect(ctx.destination);
  const a=s.a||0,e=s.e||b.duration,p={id:s.id,src};
  playing.push(p);src.onended=()=>{playing=playing.filter(x=>x!==p);tile?.classList.remove("hit")};
  tile?.classList.add("hit");src.start(0,a,Math.max(.05,e-a));
}

function render(){
  const t=$("#tabs");t.textContent="";
  const chip=(n,id,col)=>{const b=document.createElement("button");b.className="chip"+(cur===id?" on":"");b.textContent=n;if(col!=null&&cur===id)b.style.background=COL[col];b.onclick=()=>{cur=id;render()};t.append(b)};
  chip("Tout","all");S.cats.forEach(c=>chip(c.name,c.id,c.col));
  if(edit){
    const a=document.createElement("button");a.className="chip";a.textContent="＋ Catégorie";a.onclick=newCat;t.append(a);
    if(cur!=="all"){const m=document.createElement("button");m.className="chip";m.textContent="✎ Modifier";m.onclick=editCat;t.append(m)}
  }
  const g=$("#grid");g.textContent="";g.className=edit?"edit":"";g.style.setProperty("--n",S.cols);
  const list=sounds.filter(s=>cur==="all"||s.cat===cur).sort((a,b)=>a.order-b.order);
  if(!list.length){g.innerHTML='<p class="empty">Aucun son ici.<br>Touche ＋ pour enregistrer ou importer.</p>'}
  list.forEach(s=>{
    const c=S.cats.find(c=>c.id===s.cat),b=document.createElement("button");
    b.className="tile";b.dataset.id=s.id;b.style.background=COL[c?c.col:4];
    b.innerHTML="<b></b><span></span>";b.firstChild.textContent=s.emoji||"🔊";b.lastChild.textContent=s.name||"";
    b.onclick=()=>{if(!edit)play(s,b)};drag(b,s);g.append(b);
  });
  $("#ed").classList.toggle("on",edit);
  const old=sounds.length&&Date.now()-S.last>14*864e5;
  $("#ban").hidden=!old;$("#ban").textContent="💾 Pense à faire une sauvegarde (réglages ⚙️)";
}
$("#ban").onclick=()=>openSet();

function drag(t,s){
  t.onpointerdown=e=>{
    if(!edit)return;const x0=e.clientX,y0=e.clientY;let on=false;t.setPointerCapture(e.pointerId);
    t.onpointermove=v=>{if(!on&&Math.hypot(v.clientX-x0,v.clientY-y0)>10){on=true;t.classList.add("drag")}if(on)t.style.transform=`translate(${v.clientX-x0}px,${v.clientY-y0}px)`};
    t.onpointerup=async v=>{
      t.onpointermove=t.onpointerup=null;if(!on)return openEd(s);
      t.style.visibility="hidden";const o=document.elementFromPoint(v.clientX,v.clientY)?.closest(".tile");t.style.visibility="";
      if(o&&o!==t){const l=[...sounds].sort((a,b)=>a.order-b.order).filter(x=>x.id!==s.id);l.splice(l.findIndex(x=>x.id===o.dataset.id),0,s);
        for(const [i,x] of l.entries()){x.order=i;await put("sounds",x)}}
      render();
    };
  };
}
async function newCat(){const n=prompt("Nom de la catégorie ?");if(!n)return;S.cats.push({id:uid(),name:n.slice(0,20),col:S.cats.length%6});cur=S.cats.at(-1).id;await save();render()}
async function editCat(){
  const c=S.cats.find(c=>c.id===cur);if(!c)return;
  const n=prompt("Nom (laisser vide pour supprimer la catégorie)",c.name);if(n===null)return;
  if(n===""){if(!confirm("Supprimer « "+c.name+" » ? Les sons passent dans une autre catégorie."))return;
    S.cats=S.cats.filter(x=>x.id!==c.id);if(!S.cats.length)S.cats.push({id:uid(),name:"Favoris",col:0});
    for(const s of sounds.filter(s=>s.cat===c.id)){s.cat=S.cats[0].id;await put("sounds",s)}cur="all"}
  else{c.name=n.slice(0,20);if(confirm("Changer la couleur ?"))c.col=(c.col+1)%6}
  await save();render();
}

/* éditeur */
let ed=null,cb=null,cbuf=null,mr,chunks=[];
const dE=$("#dE");
function fillCats(v){$("#ct").innerHTML="";S.cats.forEach(c=>$("#ct").add(new Option(c.name,c.id)));$("#ct").value=v}
$("#ems").innerHTML=EMO.map(e=>`<button class="em" type="button">${e}</button>`).join("");
$("#ems").onclick=e=>{if(e.target.classList.contains("em"))$("#em").value=e.target.textContent};
async function setBlob(b){cb=b;cbuf=await decode(b);$("#ra").value=ed.a?ed.a/cbuf.duration*1000:0;$("#rb").value=ed.e?ed.e/cbuf.duration*1000:1000;draw()}
function draw(){
  const c=$("#wv"),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);if(!cbuf)return;
  const d=cbuf.getChannelData(0),step=Math.floor(d.length/W)||1,a=$("#ra").value/1000*W,e=$("#rb").value/1000*W;
  for(let i=0;i<W;i++){let m=0;for(let j=0;j<step;j+=Math.ceil(step/20))m=Math.max(m,Math.abs(d[i*step+j]||0));
    x.fillStyle=i>=a&&i<=e?"#9b6bff":"#cfc6ee";const h=Math.max(2,m*H*.95);x.fillRect(i,(H-h)/2,1,h)}
  $("#dur").textContent=((($("#rb").value-$("#ra").value)/1000)*cbuf.duration).toFixed(1)+" s";
}
$("#ra").oninput=()=>{if(+$("#ra").value>+$("#rb").value-5)$("#ra").value=$("#rb").value-5;draw()};
$("#rb").oninput=()=>{if(+$("#rb").value<+$("#ra").value+5)$("#rb").value=+$("#ra").value+5;draw()};
function openEd(s){
  ed=s?{...s}:{id:uid(),a:0,e:0};cb=cbuf=null;
  $("#eT").textContent=s?"Modifier le son":"Nouveau son";
  $("#nm").value=s?.name||"";$("#em").value=s?.emoji||"🔔";$("#vo").value=(s?.vol??1)*100;
  fillCats(s?.cat||(cur!=="all"?cur:S.cats[0].id));$("#dl").hidden=!s;
  $("#ra").value=0;$("#rb").value=1000;draw();$("#dur").textContent="";
  if(s)setBlob(s.blob);dE.showModal();
}
$("#add").onclick=()=>openEd();
$("#ed").onclick=()=>{edit=!edit;render()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await setBlob(f);if(!$("#nm").value)$("#nm").value=f.name.replace(/\.[^.]+$/,"").slice(0,30)}catch{alert("Format audio non lisible.")}e.target.value=""};
$("#rec").onclick=async()=>{
  if(mr?.state==="recording"){mr.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());$("#rec").textContent="● Enregistrer";ed.a=ed.e=0;await setBlob(new Blob(chunks,{type:mr.mimeType}))};
    mr.start();$("#rec").textContent="■ Arrêter"}catch{alert("Micro non autorisé.")}
};
$("#pre").onclick=()=>{if(!cbuf)return;const s=ac().createBufferSource(),g=ctx.createGain();s.buffer=cbuf;g.gain.value=$("#vo").value/100;s.connect(g).connect(ctx.destination);const a=$("#ra").value/1000*cbuf.duration,e=$("#rb").value/1000*cbuf.duration;s.start(0,a,e-a)};
$("#cx").onclick=()=>{if(mr?.state==="recording")mr.stop();dE.close()};
$("#sv").onclick=async()=>{
  if(!cb)return alert("Enregistre ou importe d’abord un son.");
  const D=cbuf.duration,a=$("#ra").value/1000*D,e=$("#rb").value/1000*D;
  Object.assign(ed,{name:$("#nm").value.trim()||"Son",emoji:$("#em").value||"🔊",cat:$("#ct").value,vol:$("#vo").value/100,blob:cb,a:a<.02?0:a,e:e>D-.02?0:e});
  if(ed.order==null)ed.order=Math.max(-1,...sounds.map(s=>s.order))+1;
  await put("sounds",ed);delete buf[ed.id];sounds=await all("sounds");dE.close();render();
};
$("#dl").onclick=async()=>{if(!confirm("Supprimer ce son ?"))return;await del("sounds",ed.id);sounds=await all("sounds");dE.close();render()};

/* réglages et sauvegardes */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function openSet(){
  $("#mo").value=S.mode;$("#nc").value=S.cols;
  const e=await navigator.storage?.estimate?.();
  $("#inf").textContent=`${sounds.length} sons`+(e?` · ${(e.usage/1e6).toFixed(1)} Mo utilisés`:"")+(S.last?` · dernier export : ${new Date(S.last).toLocaleDateString("fr-FR")}`:" · aucun export");
  const sn=await get("snap","1");$("#rs").disabled=!sn;$("#sn").textContent=sn?`Sauvegarde interne (${new Date(sn.date).toLocaleDateString("fr-FR")})`:"Sauvegarde interne";
  $("#dS").showModal();
}
$("#st").onclick=openSet;$("#cl").onclick=()=>$("#dS").close();
$("#mo").onchange=async e=>{S.mode=e.target.value;await save()};
$("#nc").onchange=async e=>{S.cols=+e.target.value;await save();render()};
$("#sa").onclick=()=>playing.slice().forEach(p=>p.src.stop());
$("#ex").onclick=async()=>{
  const out={v:1,cats:S.cats,sounds:await Promise.all(sounds.map(async s=>({...s,blob:await b64(s.blob)})))};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));
  a.download=`soundboard-${new Date().toISOString().slice(0,10)}.json`;a.click();S.last=Date.now();await save();render();openSet();
};
$("#im").onclick=()=>$("#jf").click();
$("#jf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    for(const c of d.cats)if(!S.cats.some(x=>x.id===c.id))S.cats.push(c);
    for(const s of d.sounds){s.blob=await (await fetch(s.blob)).blob();await put("sounds",s)}
    await save();sounds=await all("sounds");buf={};render();alert(d.sounds.length+" sons importés.")}
  catch{alert("Fichier de sauvegarde invalide.")}e.target.value="";
};
$("#sn").onclick=async()=>{await put("snap",{id:"1",date:Date.now(),cats:S.cats,sounds});openSet()};
$("#rs").onclick=async()=>{
  const sn=await get("snap","1");if(!sn||!confirm("Remplacer tout par la sauvegarde interne du "+new Date(sn.date).toLocaleDateString("fr-FR")+" ?"))return;
  for(const s of sounds)await del("sounds",s.id);for(const s of sn.sounds)await put("sounds",s);
  S.cats=sn.cats;await save();sounds=await all("sounds");buf={};cur="all";render();$("#dS").close();
};

(async()=>{
  db=await open();S={...S,...(await get("kv","state")||{})};sounds=await all("sounds");
  navigator.storage?.persist?.();render();
  if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
})();
</script></body></html>
